apiVersion: v1
data:
  burst_4k1000_6_14_6_14_6.yaml: |
    load:
      type: constant
      stages:
      - rate: 6
        duration: 720
      - rate: 14
        duration: 720
      - rate: 6
        duration: 720
      - rate: 14
        duration: 720
      - rate: 6
        duration: 720
      request_timeout: 300
    api:
      type: completion
      streaming: true
    server:
      type: vllm
      model_name: Qwen/Qwen3-0.6B
      base_url: http://172.30.18.103:80
      ignore_eos: true
    tokenizer:
      pretrained_model_name_or_path: Qwen/Qwen3-0.6B
    data:
      type: random
      input_distribution:
        min: 4000
        max: 4000
        mean: 4000
        std_dev: 0
        total_count: 33120
      output_distribution:
        min: 1000
        max: 1000
        mean: 1000
        std_dev: 0
        total_count: 33120
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: false
    storage:
      local_storage:
        path: /workspace
  guide_multimodal-serving_1.yaml: |
    load:
      type: constant
      interval: 60.0
      stages:
        # Warmup — seat residents (~1×S)
        - rate: 5
          duration: 600            # 5*600  = 3000

        # Main ladder
        - rate: 5
          duration: 100
        - rate: 10
          duration: 100
        - rate: 15
          duration: 100
        - rate: 20
          duration: 100
        - rate: 25
          duration: 100
        - rate: 30
          duration: 100
        - rate: 35
          duration: 100
    api:
      type: chat
      streaming: true
    server:
      type: vllm
      model_name: REPLACE_ENV_LLMDBENCH_DEPLOY_CURRENT_MODEL
      base_url: REPLACE_ENV_LLMDBENCH_HARNESS_STACK_ENDPOINT_URL
      ignore_eos: true
    tokenizer:
      pretrained_model_name_or_path: REPLACE_ENV_LLMDBENCH_DEPLOY_CURRENT_MODEL
    data:
      type: shared_prefix
      shared_prefix:
        multimodal:
          image:
          count: { type: fixed, min: 4, max: 4, mean: 4 }  # items per request
          insertion_point: 0.0
          resolutions:
            - resolution: "720p"
              weight: 1
        num_groups: 600
        num_prompts_per_group: 5
        system_prompt_len: 100
        question_len: 1200
        output_len: 300
        enable_multi_turn_chat: false
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: true
    storage:
      local_storage:
        path: /workspace
  guide_predicted-latency-routing_1.yaml: |
    load:
      type: concurrent
      num_workers: 6
      request_timeout: 300.0
      stages:
        - num_requests: 192
          concurrency_level: 32
    api:
      type: completion
      streaming: true
    server:
      type: vllm
      model_name: REPLACE_ENV_LLMDBENCH_DEPLOY_CURRENT_MODEL
      base_url: REPLACE_ENV_LLMDBENCH_HARNESS_STACK_ENDPOINT_URL
      ignore_eos: true
    tokenizer:
      pretrained_model_name_or_path: REPLACE_ENV_LLMDBENCH_DEPLOY_CURRENT_MODEL
      data:
        type: conversation_replay
        conversation_replay:
          seed: ${CONCURRENCY}         # unique seed per concurrency level
          num_conversations: ${CONCURRENCY}   # equals concurrency_level above
          shared_system_prompt_len: 3000
          dynamic_system_prompt_len:
            type: uniform
            min: 15000
            max: 100000
            mean: 55000
            std_dev: 25000
          turns_per_conversation:
            type: normal
            min: 2
            max: 20
            mean: 6
            std_dev: 3.5
          input_tokens_per_turn:
            type: lognormal
            min: 100
            max: 10000
            mean: 1500
            std_dev: 1200
          output_tokens_per_turn:
            type: lognormal
            min: 50
            max: 4000
            mean: 800
            std_dev: 600
          tool_call_latency_sec:
            type: normal
            min: 0
            max: 0
            mean: 0
            std_dev: 0
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: true
    storage:
      local_storage:
        path: /workspace
kind: ConfigMap
metadata:
  name: inference-perf-profiles
  namespace: biran
