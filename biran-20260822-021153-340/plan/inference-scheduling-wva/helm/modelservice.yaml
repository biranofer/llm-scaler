# Source: llm-d-modelservice/templates/decode-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-qwe-3db867ce-en3-0-6b-decode
  labels:
    helm.sh/chart: llm-d-modelservice-v0.4.15
    app.kubernetes.io/version: "v0.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      llm-d.ai/guide: optimized-baseline
      llm-d.ai/inference-serving: "true"
      llm-d.ai/inferenceServing: "true"
      llm-d.ai/model: qwen-qwe-3db867ce-en3-0-6b
      llm-d.ai/variant: qwen-qwe-3db867ce-en3-0-6b-decode
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        llm-d.ai/guide: optimized-baseline
        llm-d.ai/inference-serving: "true"
        llm-d.ai/inferenceServing: "true"
        llm-d.ai/model: qwen-qwe-3db867ce-en3-0-6b
        llm-d.ai/variant: qwen-qwe-3db867ce-en3-0-6b-decode
        llm-d.ai/role: decode
    spec:
      initContainers:
        - name: routing-proxy
          args:
            - --port=8000
            - --vllm-port=8200
            - --connector=nixlv2
            - --zap-encoder=json
            - --zap-log-level=debug
            - --secure-proxy=false
          image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources: {}
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
        - command:
          - set_llmdbench_environment.py
          - -e
          - /shared-config/llmdbench_env.sh
          - -i
          env:
          - name: VLLM_IS_DECODE
            value: "1"
          - name: HOME
            value: /tmp
          - name: USER
            value: llm-d
          - name: HF_HOME
            value: /tmp/huggingface
          - name: MODEL_NAME
            value: Qwen/Qwen3-0.6B
          - name: MODEL_PATH
            value: models/Qwen/Qwen3-0.6B
          - name: VLLM_CACHE_ROOT
            value: /tmp/vllm
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
            value: "120"
          - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
            value: "1"
          - name: VLLM_SERVER_DEV_MODE
            value: "1"
          - name: VLLM_INFERENCE_PORT
            value: "8000"
          - name: VLLM_METRICS_PORT
            value: "8200"
          - name: VLLM_BLOCK_SIZE
            value: "64"
          - name: VLLM_MAX_MODEL_LEN
            value: "16000"
          - name: VLLM_LOAD_FORMAT
            value: auto
          - name: VLLM_ACCELERATOR_MEM_UTIL
            value: "0.9"
          - name: VLLM_MAX_NUM_SEQ
            value: "256"
          - name: VLLM_TENSOR_PARALLELISM
            value: "1"
          - name: VLLM_MAX_NUM_BATCHED_TOKENS
            value: "256"
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_NIXL_SIDE_CHANNEL_PORT
            value: "5557"
          - name: UCX_TLS
            value: sm,cuda_ipc,cuda_copy,tcp
          - name: UCX_SOCKADDR_TLS_PRIORITY
            value: tcp
          - name: POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
          - name: LLMDBENCH_POD_NS
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: PYTORCH_ALLOC_CONF
            value: expandable_segments:True
          image: ghcr.io/llm-d/llm-d-benchmark:v0.7.8
          imagePullPolicy: Always
          name: preprocess
          volumeMounts:
          - mountPath: /shared-config
            name: shared-config
    
      schedulerName: default-scheduler
      serviceAccountName: qwen-qwe-3db867ce-en3-0-6b
      
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: nvidia.com/gpu.product
                  operator: In
                  values:
                    - NVIDIA-H100-80GB-HBM3
      volumes:
        - emptyDir: {}
          name: shared-config
        - emptyDir:
            medium: Memory
            sizeLimit: 16Gi
          name: dshm
      
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc
            readOnly: true
      
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.26.0
            
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8200
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/models
              port: 8200
            periodSeconds: 5
            timeoutSeconds: 2
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RAWIO
            runAsGroup: 0
            runAsUser: 0
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /v1/models
              port: 8200
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          imagePullPolicy: IfNotPresent
          
          command:
            - /bin/bash
            - -c
          args:
            - |
              /bin/true ; vllm serve /model-cache/models/Qwen/Qwen3-0.6B \
                --host 0.0.0.0 \
                --served-model-name Qwen/Qwen3-0.6B \
                --port $VLLM_METRICS_PORT \
                --block-size $VLLM_BLOCK_SIZE \
                --max-model-len $VLLM_MAX_MODEL_LEN \
                --tensor-parallel-size $VLLM_TENSOR_PARALLELISM \
                --gpu-memory-utilization $VLLM_ACCELERATOR_MEM_UTIL \
                --enforce-eager \
                --no-enable-log-requests \
                --disable-uvicorn-access-log \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          env:
          - name: VLLM_IS_DECODE
            value: "1"
          - name: HOME
            value: /tmp
          - name: USER
            value: llm-d
          - name: HF_HOME
            value: /tmp/huggingface
          - name: MODEL_NAME
            value: Qwen/Qwen3-0.6B
          - name: MODEL_PATH
            value: models/Qwen/Qwen3-0.6B
          - name: VLLM_CACHE_ROOT
            value: /tmp/vllm
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
            value: "120"
          - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
            value: "1"
          - name: VLLM_SERVER_DEV_MODE
            value: "1"
          - name: VLLM_INFERENCE_PORT
            value: "8000"
          - name: VLLM_METRICS_PORT
            value: "8200"
          - name: VLLM_BLOCK_SIZE
            value: "64"
          - name: VLLM_MAX_MODEL_LEN
            value: "16000"
          - name: VLLM_LOAD_FORMAT
            value: auto
          - name: VLLM_ACCELERATOR_MEM_UTIL
            value: "0.9"
          - name: VLLM_MAX_NUM_SEQ
            value: "256"
          - name: VLLM_TENSOR_PARALLELISM
            value: "1"
          - name: VLLM_MAX_NUM_BATCHED_TOKENS
            value: "256"
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_NIXL_SIDE_CHANNEL_PORT
            value: "5557"
          - name: UCX_TLS
            value: sm,cuda_ipc,cuda_copy,tcp
          - name: UCX_SOCKADDR_TLS_PRIORITY
            value: tcp
          - name: POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
          - name: LLMDBENCH_POD_NS
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: PYTORCH_ALLOC_CONF
            value: expandable_segments:True
          - name: DP_SIZE
            value: "1"
          - name: TP_SIZE
            value: "1"
          - name: DP_SIZE_LOCAL
            value: "1"
          
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-d-hf-token
                key: HF_TOKEN
          
          ports:
          - containerPort: 5557
            protocol: TCP
          - containerPort: 8200
            name: metrics
            protocol: TCP
          resources:
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
          
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /shared-config
              name: shared-config
            - name: model-storage
              mountPath: /model-cache
              readOnly: true
