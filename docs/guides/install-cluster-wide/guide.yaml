name: install-cluster-wide

prerequisites:
  check:
    run: make check-prereqs SCOPE=cluster

deploy:
  all:
    run: make deploy-wva SCOPE=cluster
  register:
    run: |
      make scaledobjects-plan WVA_DEFAULT_SO_PLAN=wva-plan.yaml
      # edit wva-plan.yaml: apply: yes|no|adopt, the modelID, the replica bounds
      make scaledobjects-apply WVA_DEFAULT_SO_PLAN=wva-plan.yaml

verify:
  objects:
    run: kubectl get scaledobject,hpa -A

cleanup:
  uninstall:
    run: make undeploy-wva SCOPE=cluster
