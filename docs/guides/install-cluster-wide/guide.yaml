name: install-cluster-wide

env:
  static:
    namespace:
      note: Where the controller runs. It manages every namespace regardless.
      run: export WVA_NS=workload-variant-autoscaler-system

prerequisites:
  check:
    note: Read-only. Reports what it would create, and the Prometheus it found.
    run: make check-prereqs-cluster-on-k8s

deploy:
  all:
    note: |
      One command, all three phases. The right thing when you are a cluster admin
      installing for yourself. Add IMG=<your build> for an unmerged branch.
    run: make deploy-wva-on-k8s
  register:
    note: Nothing scales until a ScaledObject exists.
    run: |
      make scaledobjects-plan
      make scaledobjects-apply

verify:
  objects:
    run: kubectl get scaledobject,hpa -A

cleanup:
  uninstall:
    run: make undeploy-wva-on-k8s
