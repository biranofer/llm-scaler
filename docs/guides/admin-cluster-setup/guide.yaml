name: admin-cluster-setup

env:
  static:
    namespace:
      run: export NAMESPACE=team-a

prerequisites:
  check:
    run: make check-prereqs

deploy:
  prereqs:
    run: make setup-prereqs
  out_of_reach:
    run: |
      make setup-prereqs   WVA_NS=wva-${NAMESPACE}
      make deploy-wva      WVA_NS=wva-${NAMESPACE} WVA_WATCH_NS=${NAMESPACE} INSTALL_PHASE=wva

cleanup:
  undo:
    run: make undeploy-wva
