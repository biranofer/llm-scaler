name: admin-cluster-setup

env:
  static:
    namespace:
      note: The namespace whose owner will install and upgrade the controller.
      run: export NAMESPACE=team-a

prerequisites:
  check:
    note: Read-only — what this would create, and whether you may create it.
    run: make check-prereqs-namespace-on-k8s WVA_NS=${NAMESPACE}

deploy:
  prereqs:
    note: |
      Once per namespace, not once per upgrade. Creates the namespace, the
      cluster-scoped RBAC, the ServiceMonitor, and Prometheus/KEDA if absent.
    run: make setup-prereqs-namespace-on-k8s WVA_NS=${NAMESPACE}
  out_of_reach:
    note: |
      Where the bound must actually hold, run the controller in a namespace you
      own and point it at theirs — a tenant who owns the Deployment owns its args.
    run: |
      make setup-prereqs-namespace-on-k8s WVA_NS=wva-${NAMESPACE}
      make deploy-wva-namespace-on-k8s   WVA_NS=wva-${NAMESPACE} WVA_WATCH_NS=${NAMESPACE}

cleanup:
  undo:
    run: make undeploy-wva-on-k8s WVA_NS=${NAMESPACE} WVA_SCOPE=namespace
