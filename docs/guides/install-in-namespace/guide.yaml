# Machine-readable half of this guide. The bash blocks in README.md are rendered
# from here — see hack/render-guides.py — so the commands a reader copies and the
# commands a tool would run are the same strings.
name: install-in-namespace

env:
  static:
    namespace:
      run: export NAMESPACE=<your-namespace>

prerequisites:
  check:
    run: make check-prereqs

deploy:
  prereqs:
    run: make setup-prereqs
  controller:
    run: make deploy-wva
  register:
    run: |
      make scaledobjects-plan WVA_DEFAULT_SO_PLAN=wva-plan.yaml
      # edit wva-plan.yaml: apply: yes|no|adopt, the modelID, the replica bounds
      make scaledobjects-apply WVA_DEFAULT_SO_PLAN=wva-plan.yaml

verify:
  objects:
    run: kubectl get scaledobject,hpa -n ${NAMESPACE}
  decisions:
    run: kubectl logs -n ${NAMESPACE} deploy/wva-controller-manager | grep scaling-decision

visualize:
  dashboard:
    run: make dashboard
  smoke:
    run: make benchmark-smoke NAMESPACE=${NAMESPACE}

cleanup:
  uninstall:
    run: make undeploy-wva
