apiVersion: v1
kind: Namespace
metadata:
  name: biran
  labels:
    openshift.io/user-monitoring: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wva-prometheus-auth
  namespace: biran
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: allow-thanos-querier-api-access-biran
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: allow-thanos-querier-api-access
subjects:
- kind: ServiceAccount
  name: wva-prometheus-auth
  namespace: biran
