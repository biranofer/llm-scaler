router:
  epp:
    env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          key: HF_TOKEN
          name: llm-d-hf-token
    extProcPort: 9002
    extraContainerPorts:
    - containerPort: 5557
      name: zmq
      protocol: TCP
    flags:
      v: '4'
    image:
      pullPolicy: Always
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: v0.9.0
    pluginsConfigFile: wva-plugins.yaml
    pluginsCustomConfig:
      wva-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        featureGates:
          - flowControl
        plugins:
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: prefix-cache-scorer
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: queue-scorer
                weight: 2
              - pluginRef: kv-cache-utilization-scorer
                weight: 2
              - pluginRef: prefix-cache-scorer
                weight: 3
    replicas: 1
    volumeMounts: []
    volumes: []
  extraServicePorts:
  - name: zmq
    port: 5557
    protocol: TCP
    targetPort: 5557
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8081
  inferencePool:
    failureMode: FailOpen
  modelServers:
    matchLabels:
      llm-d.ai/inferenceServing: 'true'
      llm-d.ai/model: qwen-qwe-3db867ce-en3-0-6b
    targetPorts:
    - number: 8000
  monitoring:
    interval: 10s
    prometheus:
      auth:
        enabled: true
        secretName: inference-gateway-sa-metrics-reader-secret
      enabled: true
    secretName: inference-gateway-sa-metrics-reader-secret
  tokenizer:
    enabled: false
