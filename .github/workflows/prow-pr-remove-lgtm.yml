name: Prow Remove LGTM
on: pull_request

jobs:
  remove-lgtm:
    # Same-repo branches only. The reusable workflow removes a label, and on the
    # `pull_request` event a fork's GITHUB_TOKEN is read-only no matter what
    # `permissions:` asks for, so the write fails with 403 "Resource not
    # accessible by integration". Skipping is honest: the job cannot do its work
    # on a fork PR, and a red check that reports who opened the PR rather than
    # what it changes trains reviewers to ignore red checks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: llm-d/llm-d-infra/.github/workflows/reusable-prow-remove-lgtm.yaml@main
