apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
# Grant the WVA controller cluster-monitoring-view so it can query Thanos
# Querier with its own SA token.
- manager-cluster-monitoring-view-clusterrolebinding.yaml
# NOT a binding for the user-workload Prometheus SA. There was one here, granting
# it cluster-monitoring-view "so it can scrape the controller's secure /metrics
# endpoint". It did not do that, and could not: cluster-monitoring-view carries
# `namespaces get` and `prometheuses/api` and NO nonResourceURLs rule, so it
# cannot authorize a /metrics scrape under any configuration.
#
# What actually makes the scrape work, and none of it is an RBAC grant to
# Prometheus:
#   the bearerTokenSecret patch    authenticates the scrape as WVA's OWN SA
#   the metrics-reader repoint     gives that SA nonResourceURLs: /metrics
#   UWM's own discovery            with enableUserWorkload: true it scrapes
#                                  ServiceMonitors in user-defined projects
#                                  without being told to
#
# NOT the user-monitoring label patched onto the Namespace below. In NAMESPACE
# scope that patch reaches nothing: components/tenant-installable deletes the
# Namespace object, so the label never lands on the install's namespace at all.
# It survives only in cluster scope, where the overlay keeps its own Namespace.
#
# So the binding handed the UWM Prometheus SA unrestricted platform-API read --
# every namespace's series -- from a WVA install, for no effect.
# Long-lived SA token referenced by the ServiceMonitor's bearerTokenSecret.
- controller-manager-token-secret.yaml
# Service-ca CA bundle used by the ServiceMonitor to verify the controller's
# metrics serving certificate (replaces insecureSkipVerify).
- metrics-server-ca-configmap.yaml

patches:
# Point WVA at the in-cluster Thanos Querier (OpenShift's user-workload-monitoring
# stack) and tighten TLS verification — the Service CA certificate is mounted
# from /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt by the
# deployment patch below.
- path: configmap-patch.yaml
  target:
    kind: ConfigMap
    name: manager-config
- path: deployment-patch.yaml
  target:
    kind: Deployment
    name: controller-manager
# Append the metrics cert path arg (JSON patch to avoid replacing the args list).
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --metrics-cert-path=/etc/k8s-metrics-server/serving-certs
  target:
    kind: Deployment
    name: controller-manager
# Request a service-ca serving cert for the metrics Service (metrics-server-cert Secret).
- patch: |-
    apiVersion: v1
    kind: Service
    metadata:
      name: controller-manager-metrics-service
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: metrics-server-cert
# Grant the WVA controller manager SA read access to its own /metrics endpoint
# so the ServiceMonitor can scrape it.
- patch: |-
    - op: replace
      path: /subjects/0
      value:
        kind: ServiceAccount
        name: controller-manager
  target:
    kind: ClusterRoleBinding
    name: metrics-reader-rolebinding
# Label the WVA namespace so OCP user-workload-monitoring Prometheus discovers
# ServiceMonitors inside it (required for UWM to watch the namespace).
- patch: |-
    - op: add
      path: /metadata/labels/openshift.io~1user-monitoring
      value: "true"
  target:
    kind: Namespace
# Configure the ServiceMonitor to authenticate using the WVA SA token Secret,
# which is granted metrics-reader access via the patch above.
- patch: |-
    - op: add
      path: /spec/endpoints/0/bearerTokenSecret
      value:
        name: controller-manager-token
        key: token
    - op: remove
      path: /spec/endpoints/0/bearerTokenFile
    # Enable TLS verification of the metrics serving cert.
    - op: replace
      path: /spec/endpoints/0/tlsConfig/insecureSkipVerify
      value: false
    # The namespace here is a PLACEHOLDER. `namespace:` rewrites namespace
    # fields, not a literal inside a patch value, so this string would keep
    # saying wva-system in every other namespace — and Prometheus would reject
    # the serving cert with "tls: bad certificate" on every scrape, silently,
    # because the SAN is the real service DNS name. The replacement below puts
    # the install's own namespace here. Found by installing into a namespace
    # that is not wva-system and reading the controller log.
    - op: add
      path: /spec/endpoints/0/tlsConfig/serverName
      value: wva-controller-manager-metrics-service.PLACEHOLDER-NAMESPACE.svc
    - op: add
      path: /spec/endpoints/0/tlsConfig/ca
      value:
        configMap:
          name: wva-metrics-server-ca
          key: service-ca.crt
  target:
    kind: ServiceMonitor
    name: controller-manager-metrics-monitor
