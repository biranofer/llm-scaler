apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: controller-manager-alerts
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: workload-variant-autoscaler
    release: kube-prometheus-stack
spec:
  groups:
  - name: wva.rules
    rules:
    - alert: WVAHighErrorRate
      expr: sum by (component, error_type) (rate(wva_errors_total[5m])) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "WVA error rate elevated in {{ $labels.component }}"
        description: "WVA component '{{ $labels.component }}' error_type '{{ $labels.error_type }}' rate is {{ $value | printf \"%.2f\" }}/sec (>6/min threshold) sustained for 5+ minutes. Check controller logs for error patterns."

    - alert: WVAOptimizationLoopStalled
      expr: max_over_time(wva_models_processed[10m]) == 0 or absent_over_time(wva_models_processed[10m])
      for: 15m
      labels:
        severity: info
      annotations:
        summary: "WVA has processed zero models for 15+ minutes"
        description: "wva_models_processed has been 0 (or absent) over a 10-minute window, sustained for 15+ minutes. This is EXPECTED when no VariantAutoscaling resources are being managed (an idle controller). If you do have managed workloads, it can indicate the optimization loop is stalled/crashed or metric collection is failing — check controller pod status and logs, and Prometheus connectivity."

    - alert: WVAMetricsCollectionFailing
      expr: sum by (query_type, reason) (rate(wva_metrics_collection_errors_total[5m])) > 0.0833
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "WVA metrics collection failing for {{ $labels.query_type }}"
        description: "Metrics collection query_type '{{ $labels.query_type }}' failing with reason '{{ $labels.reason }}' at {{ $value | printf \"%.2f\" }}/sec (>5/min threshold) sustained for 5+ minutes. Scaling decisions may be based on stale data. Verify Prometheus/metrics endpoint connectivity."

    - alert: WVANodeAccessDenied
      expr: wva_node_access_denied == 1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "WVA has a GPU limiter configured but cannot read nodes"
        description: "A gpu-inventory limiter is declared in the scaling-policy ConfigMap, and this controller's ServiceAccount is denied list on nodes. Every variant is therefore charged to no accelerator pool, receives no GPU budget, and HAS STOPPED SCALING UP — with no other error, because an unresolved accelerator is a normal state when no limiter is configured. This usually follows an admin adding a limiters: entry to a controller that was installed without node permission. Either grant the node read to the controller's ServiceAccount, or remove the limiters: entry."

    - alert: WVAGPUResourceExhausted
      expr: wva_available_gpus == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "GPU-labeled {{ $labels.accelerator_type }} nodes report zero allocatable accelerators"
        description: "WVA sees zero allocatable {{ $labels.accelerator_vendor }} {{ $labels.accelerator_model }} ({{ $labels.accelerator_type }}) GPUs for 5+ minutes. Note: this reflects node *allocatable* capacity (not free/schedulable GPUs), and wva_available_gpus is only emitted when a gpu-inventory limiter is declared in the saturation config's limiters list. A GPU-labeled node advertising zero allocatable accelerators usually means it is NotReady or its device plugin/driver is not installed — check GPU node status and device-plugin pods."

    - alert: WVAReplicaScalingThrashing
      expr: sum by (namespace, variant_name) (rate(wva_replica_scaling_total[10m])) > 0.033
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "WVA scaling thrashing detected for {{ $labels.namespace }}/{{ $labels.variant_name }}"
        description: "Variant {{ $labels.namespace }}/{{ $labels.variant_name }} scaling at {{ $value | printf \"%.3f\" }}/sec (>2/min threshold) sustained for 10+ minutes, indicating possible thrashing. Review scaling thresholds and consider adjusting stabilization window or thresholds."

    - alert: WVAModelWillNotScaleToZero
      expr: wva_model_scaling_blocked{reason=~"variant-floor|policy-forbids-zero"} == 1
      for: 15m
      labels:
        severity: info
      annotations:
        summary: "Model {{ $labels.namespace }}/{{ $labels.model_name }} cannot reach zero ({{ $labels.reason }})"
        description: "Half of this model's configuration asks it to park and the other half forbids it, so it never will. reason 'variant-floor': scale-to-zero is enabled, but a variant declares minReplicas > 0 — a model is at zero only when nothing serves it, so that one floor keeps the whole model up and the accelerators are billed indefinitely. reason 'policy-forbids-zero': every variant permits zero, but the model's resolved scaling policy disables scale-to-zero, so the bounds are inert; most misleading with a single variant, where minReplicas: 0 reads exactly like a deliberate request to park. Neither is an error and neither breaks serving — which is why nothing else reports them: the model is up and healthy, exactly as every other metric says it should be. Either set every variant's minReplicas to 0, or disable scale-to-zero for the model, so the configuration says what it does."
