apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace scope on OpenShift: the controller manages ONE namespace.
#
# `namespace:` is a placeholder — deploy/install.sh rewrites it to $WVA_NS.
namespace: wva-system

namePrefix: wva-

resources:
- ../../../base/

# components/openshift is NOT optional here. It carries the platform's own
# monitoring wiring — the Thanos Querier URL, the service-ca certificate, the
# user-workload-monitoring label — and without it the controller keeps the
# Kubernetes default Prometheus URL, cannot reach anything at it, and exits at
# startup. It is listed FIRST so the tenant components below can still subtract
# from what it adds.
components:
- ../../../components/namespace-scoped/
- ../../../components/openshift/
- ../../../components/tenant-installable/
