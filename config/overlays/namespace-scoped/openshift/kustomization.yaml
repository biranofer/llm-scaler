apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace scope: the controller manages ONE namespace and creates no
# cluster-scoped object, so a namespace admin can install it themselves.
#
# `namespace:` is a placeholder — deploy/install.sh rewrites it to $WVA_NS.
namespace: wva-system

namePrefix: wva-

resources:
- ../../../base/

# unauthenticated-metrics is appended by deploy/install.sh unless
# WVA_ADMIN_GRANTS=true. Applying this overlay by hand gives the self-service
# shape; a cluster admin who wants authenticated metrics and node access should
# install with WVA_ADMIN_GRANTS=true.
components:
- ../../../components/namespace-scoped/
- ../../../components/tenant-installable/
- ../../../components/unauthenticated-metrics/
