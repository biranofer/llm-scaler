apiVersion: v1
kind: ConfigMap
# The external-analyzer catalog (issue #1455). Each data key is an analyzer
# *label*; its value is the analyzer's definition. An external analyzer is
# essentially a KEDA Prometheus scaler expressed as config — a demand query (D)
# and a per-replica target (threshold P), such that desired = ceil(D / threshold).
#
# A ScalingPolicy references an analyzer by name (analyzers: [{name: ttft-slo}]);
# the name resolves against the built-in Go registry first, then this catalog.
# Adding, changing, or removing an entry takes effect on the next optimize cycle
# — no controller restart is needed.
#
# SECURITY: the query body is trusted config, run as-is (like a KEDA ScaledObject
# query). The trust boundary is RBAC on THIS ConfigMap — treat editing it as a
# privileged operation. The interpolated {{.modelID}}/{{.namespace}} are escaped
# by the controller before substitution, and a failed/empty query yields zero
# demand (no scaling action), so a bad definition cannot drive runaway scaling.
metadata:
  # Must be the catalog name (default wva-analyzers; ANALYZER_CATALOG_CONFIG_MAP_NAME override).
  name: wva-analyzers
  # The catalog is cluster-scoped: it must live in the controller's namespace.
  namespace: workload-variant-autoscaler-system
  labels:
    # Required: the controller cache filters ConfigMaps by this label. Without it,
    # watch events are silently dropped and catalog changes are never picked up.
    app.kubernetes.io/name: workload-variant-autoscaler
data:
  # ── Per-engine analyzer: a TTFT-SLO signal with a constant per-replica target. ──
  # The query body is selected by each variant's inference engine (vllm/sglang),
  # mirroring how the built-in analyzers register per-engine queries. {{.modelID}}
  # and {{.namespace}} are substituted (and escaped) per model.
  ttft-slo: |
    engines:
      vllm:
        query: sum(max_over_time(vllm:time_to_first_token_seconds_sum{namespace="{{.namespace}}",model_name="{{.modelID}}"}[1m]))
        threshold: "0.5"
      sglang:
        query: sum(max_over_time(sglang:time_to_first_token_seconds_sum{namespace="{{.namespace}}",model_name="{{.modelID}}"}[1m]))
        threshold: "0.5"

  # ── Engine-agnostic analyzer: one body (no `engines:` map), used for any engine. ──
  # Suitable for signals built on EPP/GIE metrics that do not vary by engine.
  pool-queue: |
    query: sum(max_over_time(inference_pool_average_queue_size{namespace="{{.namespace}}",model_name="{{.modelID}}"}[1m]))
    threshold: "5"
